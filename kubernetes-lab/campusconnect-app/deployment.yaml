apiVersion: apps/v1
kind: Deployment
metadata:
  name: campusconnect
  labels:
    app: campusconnect
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campusconnect
  template:
    metadata:
      labels:
        app: campusconnect
    spec:
      containers:
        - name: campusconnect
          image: campusconnect:v1        # the image built in the Docker lab
          imagePullPolicy: IfNotPresent  # use the copy loaded into the nodes
          ports:
            - containerPort: 8000        # EXPOSE 8000 in Dockerfile.v1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: campusconnect
spec:
  type: NodePort
  selector:
    app: campusconnect
  ports:
    - protocol: TCP
      port: 80          # the Service's port inside the cluster
      targetPort: 8000  # the port the Flask app listens on
      nodePort: 30001   # the port you type in your browser
